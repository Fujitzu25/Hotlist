<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="A considered collection of things worth your time.">
  <title>Hotlist — things worth your time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1e8;
      --ink: #202722;
      --muted: #737970;
      --line: #d8d7cb;
      --green: #315b43;
      --lime: #c9ed70;
      --coral: #e5785d;
      --white: #fffefa;
      --mono: "DM Mono", "Courier New", monospace;
      --sans: "Manrope", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    .masthead {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .wordmark { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
    .mark { width: 27px; height: 27px; display: grid; place-items: center; background: var(--green); color: var(--lime); font-size: 17px; line-height: 1; }
    .edition { color: var(--muted); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .intro { padding: 62px 0 41px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; }
    .eyebrow { margin: 0 0 16px; color: var(--green); font: 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(43px, 6.3vw, 78px); line-height: .99; letter-spacing: -.055em; font-weight: 700; }
    h1 span { color: var(--green); }
    .intro-copy { max-width: 345px; margin: 20px 0 0; color: #626960; font-size: 14px; line-height: 1.65; }
    .add-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 0; background: var(--green); color: white; cursor: pointer; font-size: 13px; font-weight: 700; transition: background .18s, transform .18s; }
    .add-button:hover { background: #244732; transform: translateY(-2px); }
    .add-button .plus { font-size: 20px; font-weight: 400; line-height: 1; }
    .feature { position: relative; min-height: 157px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 30px; overflow: hidden; padding: 28px 36px; background: var(--lime); }
    .feature::after { content: "01"; position: absolute; right: 138px; bottom: -35px; color: rgba(32,39,34,.08); font-size: 165px; line-height: 1; font-weight: 800; letter-spacing: -.1em; pointer-events: none; }
    .feature-label { position: relative; z-index: 1; margin: 0 0 12px; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .feature h2 { position: relative; z-index: 1; margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.04em; }
    .feature p:last-child { position: relative; z-index: 1; max-width: 550px; margin: 8px 0 0; color: #47513a; font-size: 13px; line-height: 1.5; }
    .feature-type { position: relative; z-index: 1; padding: 9px 11px; background: var(--ink); color: white; font: 10px var(--mono); text-transform: uppercase; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 39px 0 17px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter { min-height: 34px; padding: 0 13px; border: 1px solid transparent; background: transparent; color: #666c63; cursor: pointer; font-size: 12px; font-weight: 600; }
    .filter:hover { color: var(--ink); }
    .filter[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
    .tools { display: flex; align-items: center; gap: 15px; }
    .count { color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
    .search { width: 190px; height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font-size: 12px; outline: none; }
    .search:focus { border-color: var(--green); }
    .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }
    .pick { min-height: 148px; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: start; gap: 17px; padding: 26px 0 24px; border-bottom: 1px solid var(--line); animation: rise .35s both; }
    .pick-number { padding-top: 2px; color: #9a9d92; font: 11px var(--mono); }
    .pick-type { display: inline-block; margin-bottom: 10px; color: var(--green); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .pick h3 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: -.025em; }
    .pick p { margin: 8px 0 0; color: #666c63; font-size: 12px; line-height: 1.6; }
    .pick-link { display: inline-block; margin-top: 9px; color: var(--green); font: 10px var(--mono); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .pick-actions { display: flex; gap: 7px; }
    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); background: transparent; cursor: pointer; color: #71766d; font-size: 15px; }
    .icon-button:hover, .icon-button[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
    .icon-button.remove:hover { border-color: var(--coral); color: #a9412b; }
    .empty { grid-column: 1 / -1; padding: 52px 0; color: var(--muted); text-align: center; font-size: 13px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 55px; padding: 17px 0 24px; border-top: 1px solid var(--line); color: var(--muted); font: 10px var(--mono); letter-spacing: .02em; }
    dialog { width: min(460px, calc(100% - 32px)); padding: 0; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
    dialog::backdrop { background: rgba(24, 31, 26, .55); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 23px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .close-button { width: 30px; height: 30px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; }
    form { padding: 22px 23px 24px; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field label { color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .field input, .field select, .field textarea { width: 100%; min-height: 40px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 0; background: var(--white); color: var(--ink); font-size: 13px; outline: none; }
    .field textarea { min-height: 76px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
    .cancel-button { padding: 0 14px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 12px; }
    .form-actions .add-button { min-height: 40px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 700px) {
      .shell { width: min(100% - 36px, 540px); }
      .masthead { height: 64px; }
      .edition { font-size: 9px; }
      .intro { grid-template-columns: 1fr; padding: 45px 0 29px; }
      h1 { font-size: clamp(43px, 11vw, 64px); }
      .intro-copy { margin-top: 14px; }
      .intro .add-button { justify-self: start; }
      .feature { min-height: 150px; padding: 24px; }
      .feature h2 { max-width: 280px; font-size: 22px; }
      .feature::after { right: 52px; font-size: 130px; }
      .toolbar { align-items: flex-start; flex-direction: column; gap: 13px; padding-top: 27px; }
      .tools { width: 100%; justify-content: space-between; }
      .search { width: min(220px, 58vw); }
      .list { grid-template-columns: 1fr; }
      .pick { min-height: 130px; grid-template-columns: 30px minmax(0,1fr) auto; gap: 12px; }
      .footer { margin-top: 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="wordmark"><span class="mark" aria-hidden="true">+</span> HOTLIST</div>
      <div class="edition">A living collection / Vol. 01</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Good things, kept close</p>
          <h1 id="page-title">Worth your<br><span>attention.</span></h1>
          <p class="intro-copy">A small, considered collection of things to read, hear, watch, and get out there for.</p>
        </div>
        <button class="add-button" id="open-dialog" type="button"><span class="plus" aria-hidden="true">+</span> Add a pick</button>
      </section>

      <section class="feature" id="featured" aria-label="Featured pick"></section>

      <section aria-label="The collection">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter picks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">Everything</button>
            <button class="filter" type="button" data-filter="Read" aria-pressed="false">Read</button>
            <button class="filter" type="button" data-filter="Listen" aria-pressed="false">Listen</button>
            <button class="filter" type="button" data-filter="Watch" aria-pressed="false">Watch</button>
            <button class="filter" type="button" data-filter="Go" aria-pressed="false">Go</button>
            <button class="filter" type="button" data-filter="saved" aria-pressed="false">Saved</button>
          </div>
          <div class="tools">
            <span class="count" id="count" aria-live="polite"></span>
            <label class="sr-only" for="search">Search picks</label>
            <input class="search" id="search" type="search" placeholder="Find something…" autocomplete="off">
          </div>
        </div>
        <div class="list" id="list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer"><span>KEEP THE GOOD STUFF CLOSE.</span><span id="year"></span></footer>
  </div>

  <dialog id="pick-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">Add to the list</h2>
      <button class="close-button" id="close-dialog" type="button" aria-label="Close dialog">×</button>
    </div>
    <form id="pick-form">
      <div class="field"><label for="title">Title</label><input id="title" name="title" required maxlength="90" placeholder="What caught your attention?"></div>
      <div class="field"><label for="type">Format</label><select id="type" name="type"><option>Read</option><option>Listen</option><option>Watch</option><option>Go</option></select></div>
      <div class="field"><label for="note">A note (optional)</label><textarea id="note" name="note" maxlength="240" placeholder="Why is it worth a look?"></textarea></div>
      <div class="field"><label for="url">Link (optional)</label><input id="url" name="url" type="url" placeholder="https://"></div>
      <div class="form-actions"><button class="cancel-button" id="cancel-dialog" type="button">Cancel</button><button class="add-button" type="submit">Add pick</button></div>
    </form>
  </dialog>

  <script>
    const storageKey = "hotlist-picks-v1";
    const starterPicks = [
      { id: "starter-1", title: "The Art of Noticing", type: "Read", note: "A reminder that the everyday gets interesting when you pay attention.", url: "", saved: true },
      { id: "starter-2", title: "A Softer Frequency", type: "Listen", note: "The kind of album that makes a long walk feel like the plan.", url: "", saved: false },
      { id: "starter-3", title: "Sunday at the Picture House", type: "Go", note: "Pick a matinee, put your phone away, stay for the credits.", url: "", saved: false },
      { id: "starter-4", title: "Small Worlds, Big Feelings", type: "Watch", note: "A short film for when you have twenty minutes and want to feel something.", url: "", saved: false }
    ];
    const list = document.querySelector("#list");
    const featured = document.querySelector("#featured");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    const dialog = document.querySelector("#pick-dialog");
    const form = document.querySelector("#pick-form");
    let activeFilter = "all";
    let picks;

    try {
      const storedPicks = JSON.parse(localStorage.getItem(storageKey));
      picks = Array.isArray(storedPicks) ? storedPicks : starterPicks;
    } catch {
      picks = starterPicks;
    }

    function persist() {
      try { localStorage.setItem(storageKey, JSON.stringify(picks)); } catch { /* Keep the current session usable if storage is unavailable. */ }
    }

    function makeButton(label, className, title, pressed) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.title = title;
      button.setAttribute("aria-label", title);
      if (pressed !== undefined) button.setAttribute("aria-pressed", String(pressed));
      button.textContent = label;
      return button;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = picks.filter((pick) => {
        const matchesFilter = activeFilter === "all" || (activeFilter === "saved" ? pick.saved : pick.type === activeFilter);
        const matchesSearch = `${pick.title} ${pick.note} ${pick.type}`.toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });

      featured.replaceChildren();
      const featuredPick = picks.find((pick) => pick.saved) || picks[0];
      if (featuredPick) {
        featured.hidden = false;
        const label = document.createElement("p");
        label.className = "feature-label";
        label.textContent = "On the list right now";
        const title = document.createElement("h2");
        title.textContent = featuredPick.title;
        const note = document.createElement("p");
        note.textContent = featuredPick.note || "A fresh addition to the collection.";
        const type = document.createElement("span");
        type.className = "feature-type";
        type.textContent = featuredPick.type;
        featured.append(label, title, note, type);
      } else {
        featured.hidden = true;
      }

      list.replaceChildren();
      count.textContent = `${visible.length} ${visible.length === 1 ? "PICK" : "PICKS"}`;
      if (visible.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = picks.length ? "Nothing here yet. Try another filter." : "Your list is empty. Add a pick to get started.";
        list.append(empty);
        return;
      }

      visible.forEach((pick, index) => {
        const article = document.createElement("article");
        article.className = "pick";
        article.style.animationDelay = `${Math.min(index * 45, 270)}ms`;
        const number = document.createElement("span");
        number.className = "pick-number";
        number.textContent = String(index + 1).padStart(2, "0");
        const content = document.createElement("div");
        const type = document.createElement("span");
        type.className = "pick-type";
        type.textContent = pick.type;
        const title = document.createElement("h3");
        title.textContent = pick.title;
        content.append(type, title);
        if (pick.note) {
          const note = document.createElement("p");
          note.textContent = pick.note;
          content.append(note);
        }
        if (pick.url) {
          const link = document.createElement("a");
          link.className = "pick-link";
          link.href = pick.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "OPEN LINK ↗";
          content.append(link);
        }
        const actions = document.createElement("div");
        actions.className = "pick-actions";
        const save = makeButton(pick.saved ? "★" : "☆", "icon-button", pick.saved ? "Remove from saved" : "Save pick", pick.saved);
        save.addEventListener("click", () => {
          pick.saved = !pick.saved;
          persist();
          render();
        });
        const remove = makeButton("×", "icon-button remove", "Remove pick");
        remove.addEventListener("click", () => {
          picks = picks.filter((item) => item.id !== pick.id);
          persist();
          render();
        });
        actions.append(save, remove);
        article.append(number, content, actions);
        list.append(article);
      });
    }

    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach((filter) => filter.setAttribute("aria-pressed", String(filter === button)));
        render();
      });
    });
    search.addEventListener("input", render);
    document.querySelector("#open-dialog").addEventListener("click", () => dialog.showModal());
    document.querySelector("#close-dialog").addEventListener("click", () => dialog.close());
    document.querySelector("#cancel-dialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(form);
      picks.unshift({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title: data.get("title").trim(),
        type: data.get("type"),
        note: data.get("note").trim(),
        url: data.get("url").trim(),
        saved: false
      });
      persist();
      form.reset();
      dialog.close();
      activeFilter = "all";
      document.querySelectorAll(".filter").forEach((filter) => filter.setAttribute("aria-pressed", String(filter.dataset.filter === "all")));
      render();
    });
    document.querySelector("#year").textContent = `HOTLIST / ${new Date().getFullYear()}`;
    render();
  </script>
</body>
</html>
